services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  analytics-service:
    build:
      context: ./analytics-service
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${ANALYTICS_API_KEY}
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/ezsaldo
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
      ANALYTICS_TIMEOUT_MS: ${ANALYTICS_TIMEOUT_MS:-5000}
      APP_TIME_ZONE: America/Sao_Paulo
      ALLOW_SYNTHETIC_SEED: ${ALLOW_SYNTHETIC_SEED:-false}
      DEMO_ACCOUNT_ENABLED: ${DEMO_ACCOUNT_ENABLED:-true}
      DEMO_ACCOUNT_RESET_INTERVAL_MINUTES: ${DEMO_ACCOUNT_RESET_INTERVAL_MINUTES:-30}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
